name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ASTG-Downloader.zip
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: Sealplus-main
        run: |
          chmod +x gradlew
          ./gradlew assembleGenericDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ASTG-Downloader-APK
          path: Sealplus-main/app/build/outputs/apk/**/*.apk
